<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Adopción de Mascotas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-light">

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🐾 Huellitas & Hogar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/mascotas">Mascotas</a></li>
                    <li class="nav-item"><a class="nav-link" href="/refugios">Refugios</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/contact.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal de Contacto -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card shadow-sm border-0 p-4 p-md-5">
                    <h2 class="fw-bold mb-3 text-center">Contáctanos</h2>
                    <p class="text-muted text-center mb-4">¿Tienes dudas sobre el proceso de adopción o representas a un refugio? Escríbenos y te responderemos a la brevedad.</p>

                    <form onsubmit="event.preventDefault(); alert('¡Gracias por tu mensaje! Nos pondremos en contacto pronto.'); this.reset();">
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre y Apellido</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Ej: María López" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" placeholder="nombre@correo.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="motivo" class="form-label fw-semibold">Motivo del contacto</label>
                            <select class="form-select" id="motivo" required>
                                <option value="" selected disabled>Selecciona una opción...</option>
                                <option value="adopcion">Quiero consultar por una adopción</option>
                                <option value="refugio">Soy un refugio y quiero registrarme</option>
                                <option value="transito">Quiero ofrecer hogar de tránsito</option>
                                <option value="otro">Otro motivo</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label for="mensaje" class="form-label fw-semibold">Mensaje</label>
                            <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu consulta aquí..." required></textarea>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Enviar Mensaje</button>
                            <a href="/mascotas" class="btn btn-outline-secondary">Volver al catálogo</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0 text-secondary">© 2026 Plataforma de Adopción de Mascotas - Aplicaciones Híbridas</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
